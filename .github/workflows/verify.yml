name: verify

# The project's real checks are four Python scripts that, until now, only ran
# when someone remembered to run them. Nothing enforced them on a push, and a
# regression made in a session that forgot would have landed silently. That is
# the same failure this whole branch has been chasing in the sources: a check
# nobody runs is indistinguishable from no check.
#
# Everything here is Python standard library. No install step, no lockfile, no
# network.

# Triggers: push to the default branch, and every pull request. The first
# version fired on push to ALL branches AND on pull_request, so every push to a
# PR branch ran the job twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A rapid series of pushes supersedes itself instead of
# queueing four runs of a job whose answer only matters for the head commit.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Data integrity
        # JSON parses, ids unique and well formed, and the generated plaque
        # index and multi-year table match what their builders produce.
        run: python scripts/verify/data_integrity.py

      - name: Citation and link integrity
        # Blocking: A1, A2, B, D, E, F, G on drafts, plus the three whole-wiki
        # passes. Advisory: C, and the provenance passes H-M.
        run: python scripts/verify/verify_harness.py

      - name: Internal consistency
        # Numbers asserted in prose against the data behind them. Both halves:
        # the derived-value registry and the general table check.
        run: python scripts/verify/consistency.py

      - name: Citation aim
        # BLOCKING since 2026-09-05. The harness above checks that every
        # [f_NNNN] RESOLVES; this checks that it POINTS AT SOMETHING RELEVANT.
        # A wrong-but-real id is invisible to a resolver and reads as authority
        # downstream. The four-item back catalogue is cleared (p_401), so a new
        # finding is a new defect. Note the check is a deliberately weak
        # heuristic -- it passes any citation sharing one distinctive token --
        # so a clean run is not proof of correct aim, only absence of the
        # grossest shape.
        run: python scripts/verify/citation_aim.py

      - name: Staleness
        # Advisory. Every other check asks whether the build is consistent NOW.
        # This asks whether a later finding left an earlier record behind --
        # a conflict still carrying a resolution its article has overturned, a
        # superseded fact still cited, a review comment contradicting the
        # article it sits in. Each file is valid on its own; the defect is that
        # together they say two things. Exits 0: it reports disagreements, a
        # human adjudicates them.
        run: python scripts/verify/staleness.py

      - name: Footnote labels
        # Advisory. Duplicate source labels, lettered markers that resolve to
        # nothing, and entries that landed outside the Sources list. The
        # harness's A1/B/C read entries as `^\d+\. `, so an article using
        # lettered sub-entries (8a, 8b, ... 8bq) is invisible to them. Written
        # after a duplicate 8t re-pointed two existing markers; on its first
        # run it found 21 entries sitting after "## Research Notes" in the same
        # article, and 21 markers resolving to nothing.
        run: python scripts/verify/footnote_labels.py

      - name: Embargo labelling
        # Every embargoed fact registered and dated, every marker paired, and
        # no embargoed-only name loose in an article. Unlabelled is the
        # failure, not present.
        run: python scripts/verify/restricted_guard.py
